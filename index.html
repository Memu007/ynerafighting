<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Conurbano Fighter 16-Bit: De Villa Madero al Octágono</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  :root {
    --crt-bg: #07070c;
    --gold: #ffcc00;
    --red: #e62e2e;
    --blue: #2b65ec;
    --green: #2ee653;
  }

  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
  }

  body {
    margin: 0;
    padding: 0;
    background-color: var(--crt-bg);
    color: #fff;
    font-family: 'Press Start 2P', monospace, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }

  #cabinet {
    position: relative;
    width: 100%;
    max-width: 840px;
    aspect-ratio: 16 / 10;
    background: #000;
    border: 6px solid #2a2a38;
    border-radius: 14px;
    box-shadow: 0 0 35px rgba(0, 0, 0, 0.95), inset 0 0 25px rgba(255, 255, 255, 0.08);
    overflow: hidden;
  }

  canvas {
    width: 100%;
    height: 100%;
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  /* Efecto CRT Scanlines 90s */
  #crt-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: 
      linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.38) 50%),
      radial-gradient(circle at center, transparent 62%, rgba(0, 0, 0, 0.68) 100%);
    background-size: 100% 4px, 100% 100%;
    z-index: 15;
  }

  #top-bar {
    width: 100%;
    max-width: 840px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 4px;
    font-size: 10px;
    color: #aaa;
  }

  .btn-retro {
    background: #1c1c28;
    color: #fff;
    border: 2px solid var(--gold);
    padding: 6px 10px;
    font-family: inherit;
    font-size: 9px;
    cursor: pointer;
    text-transform: uppercase;
    box-shadow: 0 3px 0 #886600;
  }

  .btn-retro:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 #886600;
  }

  /* Controles táctiles / mouse en pantalla */
  #controls-bar {
    width: 100%;
    max-width: 840px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 6px;
    gap: 10px;
  }

  .pad-group {
    display: flex;
    gap: 6px;
  }

  .ctrl-btn {
    background: #232334;
    color: #fff;
    border: 3px solid #555577;
    border-radius: 8px;
    padding: 12px 14px;
    font-family: inherit;
    font-size: 10px;
    cursor: pointer;
    box-shadow: 0 4px 0 #11111a;
    touch-action: manipulation;
  }

  .ctrl-btn:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #11111a;
  }

  .btn-punch { background: #991f1f; border-color: #ff5555; }
  .btn-kick { background: #1f4e99; border-color: #5599ff; }
  .btn-block { background: #2d7a3e; border-color: #66dd88; }
  .btn-spec { background: #997300; border-color: #ffdd44; color: #000; font-weight: bold; }

  /* Modal Subagentes */
  #subagent-modal {
    position: absolute;
    inset: 14px;
    background: rgba(10, 10, 18, 0.96);
    border: 3px solid var(--gold);
    z-index: 30;
    display: none;
    flex-direction: column;
    padding: 16px;
    overflow-y: auto;
    font-size: 10px;
    line-height: 1.7;
  }

  .agent-card {
    border-left: 4px solid var(--gold);
    background: #161622;
    padding: 10px;
    margin-bottom: 10px;
  }

  .agent-title {
    color: var(--gold);
    margin-bottom: 4px;
    font-size: 11px;
  }
</style>
</head>
<body>

<div id="top-bar">
  <div>CONURBANO FIGHTER II - 16-BIT EDITION</div>
  <div style="display:flex; gap:8px;">
    <button class="btn-retro" id="btn-audio">🔊 AUDIO: ON</button>
    <button class="btn-retro" id="btn-subagents">🤖 SUBAGENTES</button>
  </div>
</div>

<div id="cabinet">
  <canvas id="game" width="640" height="400"></canvas>
  <div id="crt-overlay"></div>

  <div id="subagent-modal">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <span style="color:var(--gold); font-size:12px;">CONSEJO DE SUBAGENTES (MODO ADVERSARIAL)</span>
      <button class="btn-retro" id="btn-close-modal">CERRAR [X]</button>
    </div>
    <div id="subagent-content"></div>
  </div>
</div>

<div id="controls-bar">
  <div class="pad-group">
    <button class="ctrl-btn" data-key="ArrowLeft">◀ IZQ</button>
    <button class="ctrl-btn" data-key="ArrowRight">DER ▶</button>
  </div>
  <div class="pad-group">
    <button class="ctrl-btn btn-punch" data-key="KeyZ">Z: PIÑA</button>
    <button class="ctrl-btn btn-kick" data-key="KeyX">X: PATADA</button>
    <button class="ctrl-btn btn-block" data-key="KeyC">C: GUARDIA</button>
    <button class="ctrl-btn btn-spec" data-key="KeyV">V: ESPECIAL</button>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  // ==========================================
  // 1. SINTETIZADOR CHIPTUNE 16-BIT (WEB AUDIO)
  // ==========================================
  let audioCtx = null;
  let audioEnabled = true;
  let bgmInterval = null;
  let currentTrack = '';

  function initAudio() {
    if (!audioCtx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playTone(freq, type, duration, vol = 0.08, slide = 0) {
    if (!audioEnabled || !audioCtx) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      if (slide !== 0) {
        osc.frequency.linearRampToValueAtTime(Math.max(40, freq + slide), audioCtx.currentTime + duration);
      }
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch (e) {}
  }

  function sfxHit(heavy = false) {
    playTone(heavy ? 110 : 170, 'sawtooth', heavy ? 0.18 : 0.1, heavy ? 0.15 : 0.1, -90);
    playTone(heavy ? 65 : 95, 'square', heavy ? 0.22 : 0.1, 0.12, -40);
  }

  function sfxWeakHit() {
    playTone(240, 'triangle', 0.06, 0.06, -30);
  }

  function sfxBlock() {
    playTone(520, 'square', 0.07, 0.08, 120);
  }

  function sfxParry() {
    playTone(680, 'square', 0.08, 0.12, 300);
    setTimeout(() => playTone(980, 'square', 0.12, 0.12, 200), 60);
  }

  function sfxSelect() {
    playTone(440, 'square', 0.06, 0.07, 180);
  }

  function sfxKO() {
    playTone(190, 'sawtooth', 0.45, 0.18, -150);
    setTimeout(() => playTone(120, 'sawtooth', 0.55, 0.18, -80), 150);
  }

  function startBGM(track) {
    if (currentTrack === track) return;
    currentTrack = track;
    if (bgmInterval) clearInterval(bgmInterval);
    let step = 0;

    const melodies = {
      madero: [146, 146, 174, 146, 196, 185, 146, 130],
      vs: [220, 261, 293, 329, 293, 261, 220, 196],
      gym: [196, 246, 293, 246, 220, 261, 329, 261],
      ufc: [164, 164, 196, 220, 246, 220, 196, 146]
    };

    bgmInterval = setInterval(() => {
      if (!audioEnabled || !audioCtx) return;
      const notes = melodies[track] || melodies.madero;
      const f = notes[step % notes.length];
      playTone(f, step % 2 === 0 ? 'square' : 'sawtooth', 0.16, 0.035);
      if (step % 4 === 0) playTone(f / 2, 'triangle', 0.2, 0.05);
      step++;
    }, 210);
  }

  document.getElementById('btn-audio').addEventListener('click', (e) => {
    initAudio();
    audioEnabled = !audioEnabled;
    e.target.textContent = audioEnabled ? '🔊 AUDIO: ON' : '🔇 AUDIO: OFF';
  });

  // ========================================================
  // 2. MOTOR DE RETRATOS PIXEL-ART 90s (ESTILO STREET FIGHTER)
  // ========================================================
  // Dibuja los retratos que aprobamos (Lautaro, Kevin, Don Osvaldo, El Braian y Henderson)
  // con píxeles grandes, dithering de los 90 y bordes marcados.
  const illustratedPortraits = {};
  for (const [id, src] of Object.entries({"lautaro": "assets/portraits/lautaro.png", "osvaldo": "assets/portraits/osvaldo.png", "kevin": "assets/portraits/kevin.png", "braian": "assets/portraits/braian.png", "henderson": "assets/portraits/henderson.png"})) {
    const image = new Image();
    image.src = src;
    illustratedPortraits[id] = image;
  }
  const portraitCache = {};

  function getPortraitCanvas(charId, bruised = false) {
    if (['tito','rulo','nico'].includes(charId)) {
      const c=document.createElement('canvas');c.width=c.height=48;const g=c.getContext('2d');
      const n=['tito','rulo','nico'].indexOf(charId);
      g.fillStyle=['#533c27','#392b54','#194442'][n];g.fillRect(0,0,48,48);
      g.fillStyle=['#a65b24','#7949aa','#238786'][n];g.fillRect(6,32,36,16);
      g.fillStyle=['#b87954','#e6b48e','#b58867'][n];g.fillRect(13,9,22,27);
      g.fillStyle='#241d1b';g.fillRect(12,6,24,8);if(n===1)g.fillRect(10,8,5,20);
      g.fillRect(17,19,4,3);g.fillRect(28,19,4,3);g.fillRect(21,29,9,2);
      return c;
    }

    const illustrated = illustratedPortraits[charId];
    if (illustrated) {
      if (illustrated.complete && illustrated.naturalWidth) return illustrated;
      const loading=document.createElement('canvas');loading.width=loading.height=72;
      const g=loading.getContext('2d');g.fillStyle='#141828';g.fillRect(0,0,72,72);
      g.fillStyle='#ffcc00';g.font='10px monospace';g.fillText('CARGANDO',10,38);
      return loading;
    }
    const key = charId + (bruised ? '_bruised' : '');
    if (portraitCache[key]) return portraitCache[key];

    const pCanvas = document.createElement('canvas');
    pCanvas.width = 48;
    pCanvas.height = 48;
    const pCtx = pCanvas.getContext('2d');
    pCtx.imageSmoothingEnabled = false;

    const px = (x, y, w, h, col) => {
      pCtx.fillStyle = col;
      pCtx.fillRect(x, y, w, h);
    };

    // Sombreado punteado estilo 16-bits (Dithering)
    const dither = (x, y, w, h, colA, colB) => {
      for (let iy = y; iy < y + h; iy++) {
        for (let ix = x; ix < x + w; ix++) {
          pCtx.fillStyle = (ix + iy) % 2 === 0 ? colA : colB;
          pCtx.fillRect(ix, iy, 1, 1);
        }
      }
    };

    if (charId === 'lautaro') {
      // Fondo nocturno estación Madero
      dither(0, 0, 48, 48, '#101828', '#18243c');
      // Buzo gris con capucha
      px(6, 36, 36, 12, '#3a414a');
      dither(8, 38, 12, 10, '#2a3038', '#3a414a');
      px(19, 40, 2, 8, '#cfd6df'); // cordón izquierdo
      px(27, 40, 2, 8, '#cfd6df'); // cordón derecho
      // Cuello y cara
      px(16, 29, 16, 9, '#c68b67');
      px(12, 13, 24, 19, '#e0a47e');
      dither(12, 16, 6, 15, '#b87b56', '#e0a47e'); // Sombra 90s mejilla
      // Raspones / Herida en la mejilla (como en la imagen aprobada)
      px(14, 23, 5, 1, '#a81818');
      px(16, 21, 1, 5, '#a81818');
      if (bruised) {
        px(26, 19, 6, 4, '#622868'); // Ojo morado post-robo
        px(24, 27, 4, 2, '#a81818'); // Sangre labio
      }
      // Ojos serios mirando al rival
      px(16, 17, 6, 2, '#1a1412'); // Ceja izq
      px(26, 17, 6, 2, '#1a1412'); // Ceja der
      px(17, 19, 4, 2, '#ffffff');
      px(19, 19, 2, 2, '#1a1412');
      px(27, 19, 4, 2, '#ffffff');
      px(29, 19, 2, 2, '#1a1412');
      // Nariz y boca firme
      px(23, 20, 2, 5, '#b87b56');
      px(19, 27, 9, 2, '#6b3b2a');
      // Pelo oscuro
      px(11, 11, 25, 5, '#181820');
      // Gorra azul gastada mirando a la derecha
      px(11, 4, 24, 8, '#2c4268');
      dither(11, 4, 12, 7, '#1d2d47', '#2c4268');
      px(20, 10, 22, 3, '#1d2d47'); // Visera
    } 
    else if (charId === 'kevin') {
      // Fondo oscuro estación
      dither(0, 0, 48, 48, '#1a1224', '#0e0a14');
      // Campera deportiva azul con tiras blancas
      px(6, 35, 36, 13, '#1049a8');
      px(8, 36, 2, 12, '#ffffff');
      px(11, 36, 2, 12, '#ffffff');
      px(35, 36, 2, 12, '#ffffff');
      px(38, 36, 2, 12, '#ffffff');
      // Cadena de oro gruesa en el cuello
      px(17, 34, 14, 7, '#181818');
      px(18, 37, 12, 3, '#ffcc00');
      px(20, 40, 8, 2, '#d49b00');
      // Cara bronceada con sonrisa sobradora
      px(13, 13, 22, 20, '#d8945c');
      dither(28, 15, 7, 16, '#ad6e3b', '#d8945c');
      // Cejas arqueadas con corte
      px(15, 16, 7, 2, '#1a120b');
      px(17, 16, 1, 2, '#d8945c'); // corte en la ceja
      px(25, 15, 7, 2, '#1a120b');
      // Ojos desafiantes mirando a la izquierda
      px(16, 18, 5, 2, '#ffffff');
      px(16, 18, 2, 2, '#111');
      px(26, 18, 5, 2, '#ffffff');
      px(26, 18, 2, 2, '#111');
      // Sonrisa provocadora blanca
      px(18, 26, 11, 3, '#ffffff');
      px(18, 25, 12, 1, '#5a2d18');
      px(18, 29, 10, 1, '#5a2d18');
      // Gorra roja hacia atrás (estilo imagen aprobada)
      px(12, 4, 24, 9, '#d62424');
      dither(24, 4, 12, 8, '#961414', '#d62424');
      px(16, 9, 10, 3, '#7a1010'); // Tira ajustable atrás
      px(33, 10, 11, 3, '#d62424'); // Visera para atrás
    }
    else if (charId === 'osvaldo') {
      // Fondo ladrillos Club Social Madero
      dither(0, 0, 48, 48, '#4a1818', '#2c0d0d');
      // Musculosa y toalla blanca al cuello
      px(8, 35, 32, 13, '#333333');
      px(11, 32, 7, 16, '#e6e6e6'); // Toalla izq
      px(30, 32, 7, 16, '#cccccc'); // Toalla der
      // Rostro curtido con arrugas
      px(13, 11, 22, 22, '#c88862');
      dither(13, 14, 7, 18, '#9e6340', '#c88862');
      px(17, 14, 14, 1, '#7c482b'); // Arruga frente
      px(16, 16, 16, 1, '#7c482b');
      // Pelo y bigote canoso tupido
      px(12, 5, 24, 7, '#b8bfc6');
      dither(12, 5, 24, 4, '#ffffff', '#8c9399');
      px(15, 17, 7, 2, '#8c9399'); // Cejas grises
      px(26, 17, 7, 2, '#8c9399');
      px(17, 19, 4, 2, '#111');
      px(27, 19, 4, 2, '#111');
      // Bigote clásico Don Osvaldo
      px(16, 25, 16, 4, '#d0d6dc');
      px(15, 27, 4, 2, '#9aa0a6');
      px(29, 27, 4, 2, '#9aa0a6');
    }
    else if (charId === 'braian') {
      // Fondo calle nocturna
      dither(0, 0, 48, 48, '#0f241c', '#08120e');
      // Campera verde y gris con cadena
      px(6, 35, 36, 13, '#2e6f40');
      px(10, 35, 6, 13, '#88929a');
      px(32, 35, 6, 13, '#88929a');
      px(18, 37, 12, 2, '#ffcc00'); // Cadena
      // Cara y sonrisa picante
      px(14, 13, 20, 20, '#d29258');
      dither(26, 14, 8, 18, '#a06835', '#d29258');
      px(16, 17, 6, 2, '#111');
      px(26, 16, 6, 2, '#111');
      px(17, 19, 4, 2, '#fff');
      px(17, 19, 2, 2, '#111');
      px(27, 19, 4, 2, '#fff');
      px(27, 19, 2, 2, '#111');
      px(18, 26, 11, 3, '#fff');
      // Gorra verde con visera blanca/verde
      px(13, 4, 22, 8, '#178a3d');
      px(8, 10, 22, 3, '#e8f5ec');
    }
    else if (charId === 'henderson') {
      // Fondo octágono UFC / Bandera USA
      px(0, 0, 48, 48, '#1a244d');
      for (let i = 0; i < 48; i += 6) {
        px(18, i, 30, 3, '#b81d2c');
        px(18, i + 3, 30, 3, '#e6e6e6');
      }
      // Trapecios y hombros gigantes de campeón MMA
      px(2, 34, 44, 14, '#c4835a');
      dither(2, 35, 14, 13, '#945a36', '#c4835a');
      // Cabeza rapada marcial con barba rasurada
      px(13, 9, 22, 24, '#c4835a');
      dither(13, 7, 22, 6, '#5c4033', '#c4835a'); // Rapado
      dither(14, 23, 20, 10, '#6e4730', '#9e6847'); // Barba
      // Ceño fruncido
      px(15, 15, 8, 3, '#2b1910');
      px(25, 15, 8, 3, '#2b1910');
      px(17, 18, 4, 2, '#fff');
      px(18, 18, 2, 2, '#111');
      px(27, 18, 4, 2, '#fff');
      px(28, 18, 2, 2, '#111');
      // Boca abierta con protector bucal tricolor (azul/blanco/rojo)
      px(18, 25, 12, 5, '#220a0a');
      px(19, 26, 3, 2, '#1d4ed8');
      px(22, 26, 4, 2, '#ffffff');
      px(26, 26, 3, 2, '#dc2626');
    }

    // Borde interior pixelado
    pCtx.strokeStyle = '#000';
    pCtx.lineWidth = 2;
    pCtx.strokeRect(1, 1, 46, 46);

    portraitCache[key] = pCanvas;
    return pCanvas;
  }

  // ========================================================
  // 3. ESTADO DEL JUEGO Y PROGRESIÓN DE PELEAS
  // ========================================================
  const STATE = {
    TITLE: 'TITLE',
    INTRO_STORY: 'INTRO_STORY',
    VS_SCREEN: 'VS_SCREEN',
    FIGHT: 'FIGHT',
    POST_ROBO: 'POST_ROBO',
    ARRIVAL: 'ARRIVAL',
    COACH: 'COACH',
    WEEK_RESULT: 'WEEK_RESULT',
    TRAIN_TRAVEL: 'TRAIN_TRAVEL',
    BRIEF: 'BRIEF',
    GYM: 'GYM',
    VICTORY_FINAL: 'VICTORY_FINAL'
  };

  let gameState = STATE.TITLE;
  let currentFightIndex = 0;
  let vsTimer = 0;
  let storyStep = 0;
  let sceneFrame = 0;
  let week = 1;
  let weekResult = null;
  let recoveryMessage='';
  let fightShop=false;
  let specialFx=0, specialOrigin=0, specialDirection=1;
  function recover(kind){
    if(minigame.active || gameState!==STATE.GYM) return;
    if(kind==='rest'){
      if(playerStats.trainsLeft<=0)return;
      playerStats.fatigue=Math.max(0,playerStats.fatigue-25);
      playerStats.trainsLeft--;travelMode='exit';sceneFrame=0;gameState=STATE.TRAIN_TRAVEL;
      recoveryMessage='Día de descanso: -25 de fatiga';
    }else if(kind==='food'){
      if(playerStats.goodFood){recoveryMessage='Ya mejoraste la comida esta semana';return;}
      if(playerStats.money<40){recoveryMessage='Necesitás $40 para mejorar la comida';return;}
      playerStats.money-=40;playerStats.goodFood=true;playerStats.fatigue=Math.max(0,playerStats.fatigue-8);
      recoveryMessage='Comida: -8 fatiga y entrenar cansa menos';
    }else{
      if(playerStats.money<60){recoveryMessage='Necesitás $60 para un masaje';return;}
      if(playerStats.fatigue===0){recoveryMessage='Ya estás descansado';return;}
      playerStats.money-=60;playerStats.fatigue=Math.max(0,playerStats.fatigue-30);
      recoveryMessage='Masaje: -30 de fatiga';
    }saveProgress();sfxSelect();
  }
  function recordResult(won,rival){
    const prize=won?120+currentFightIndex*40:30;
    playerStats.money+=prize;playerStats.fatigue=Math.min(70,playerStats.fatigue+15);
    weekResult={won,rival,prize};sceneFrame=0;gameState=STATE.WEEK_RESULT;
  }
  let travelMode='enter';
  function finishTravel(){
    if(travelMode==='exit' && playerStats.trainsLeft>0){
      travelMode='enter';sceneFrame=0;gameState=STATE.TRAIN_TRAVEL;return;
    }
    gameState=STATE.GYM;saveProgress();
  }

  // Estadísticas RPG de Lautaro
  const playerStats = {
    fuerza: 1,
    velocidad: 1,
    aguante: 1,
    tecnica: 1,
    skillPoints: 0,
    trainsLeft: 3,
    fatigue: 0, money: 60, goodFood: false
  };

  // Lista de combates desde Estación Madero hasta el cinturón de UFC
  const FIGHTS = [
    {
      id: 'prologo_kevin',
      name: 'EL KEVIN',
      subtitle: 'EMBOSCADA EN ESTACIÓN MADERO',
      portrait: 'kevin',
      stage: 'madero',
      isPrologue: true,
      hp: 240,
      atk: 18,
      speed: 2.3,
      color: '#1049a8',
      capColor: '#d62424',
      quotePlayer: '¡Dejá pasar loco, vengo cansado de cursar y laburar todo el día!',
      quoteEnemy: '¡Entregá la mochila en Villa Madero gil, acá no pasás!'
    },
    ...[
      ['tito', 'TITO', 'DEBUT AMATEUR', 190, 10, 1.8, '#a65b24'],
      ['rulo', 'EL RULO', 'CIRCUITO BARRIAL', 265, 13, 2.05, '#7949aa'],

    ].map(([id, name, subtitle, hp, atk, speed, color]) => ({

  const saveKey='conurbano-fighter-save-v1';
  let savedRun=null, saveAvailable=true;
  try{const data=JSON.parse(localStorage.getItem(saveKey));if(data&&data.version===1&&Number.isInteger(data.index)&&data.index>=1&&data.index<FIGHTS.length&&data.stats&&['fuerza','velocidad','aguante','tecnica','fatigue','money','trainsLeft'].every(k=>Number.isFinite(data.stats[k]))&&data.stats.trainsLeft>=0&&data.stats.trainsLeft<=3)savedRun=data;}catch{saveAvailable=false;}
  function saveProgress(){
    if(currentFightIndex<1)return;
    savedRun={version:1,index:currentFightIndex,week,stats:{...playerStats}};
    try{localStorage.setItem(saveKey,JSON.stringify(savedRun));}catch{saveAvailable=false;}
  }
  function clearProgress(){savedRun=null;try{localStorage.removeItem(saveKey);}catch{}}
  const rivalStyles=['prologue','basic','pressure','defensive','counter','pressure'];

  // ========================================================
  // 4. ENTIDADES DE COMBATE Y BALANCE DEL PRÓLOGO
  // ========================================================
  let player = null;
  let enemy = null;
  let braianAmbush = null;
  let floatingTexts = [];
  let fightBanner = '';
  let fightBannerTimer = 0;
  let prologueHitsLanded = 0;
  let fightTimer = 99;
  let lastSecondTick = 0;

  function setupFight(index) {
    const f = FIGHTS[index];
    const maxPlayerHp = f.isPrologue ? 115 : Math.round((110 + playerStats.aguante * 18)*(1-playerStats.fatigue/350));

    player = {
      x: 150,
      y: 310,
      vx: 0,
      dir: 1,
      hp: maxPlayerHp,
      maxHp: maxPlayerHp,
      energy: 0,
      state: 'idle', // idle, walk, punch, kick, block, hit, ko, special
      stateTimer: 0,
      combo: 0,
      hasBackpack: f.isPrologue
    };

    enemy = {
      x: 460,
      y: 310,
      vx: 0,
      dir: -1,
      hp: f.hp,
      maxHp: f.hp,
      state: 'idle',
      stateTimer: 0,
      aiCooldown: 35,
      telegraph: 0,
      enraged: false,
      hitsTaken: 0
    };

    // En el prólogo, El Braian espera escondido para emboscar después de que intentes pelear
    braianAmbush = {
      active: false,
      x: -40,
      y: 310,
      done: false
    };

    specialFx=0;
    prologueHitsLanded = 0;
    floatingTexts = [];
    fightTimer = 99;
    fightBanner = 'ROUND 1 - ¡A PELEAR!';
    fightBannerTimer = 90;
  }

  function addFloatingText(x, y, text, color = '#ffcc00') {
    floatingTexts.push({ x, y, text, color, life: 45 });
  }

  // ========================================================
  // 5. ENTRENAMIENTO INTERACTIVO EN EL GIMNASIO DE DON OSVALDO
  // ========================================================
  let minigame = {
    active: false,
    cursor: 0,
    dir: 1,
    speed: 3.5,
    hits: 0,
    attempts: 0,
    statTarget: 'fuerza'
  };

  function finishTraining(){
    const st=minigame.statTarget, threshold=st==='tecnica'?5:st==='aguante'?10:st==='velocidad'?4:2;
    const gain=minigame.hits>=threshold?2:1;
    minigame.active=false;playerStats.trainsLeft--;playerStats[st]+=gain;
    playerStats.fatigue=Math.min(70,playerStats.fatigue+(playerStats.goodFood?7:12));
    recoveryMessage=`${st.toUpperCase()} +${gain} · Nivel ${playerStats[st]}`;
    saveProgress();travelMode='exit';sceneFrame=0;gameState=STATE.TRAIN_TRAVEL;
  }

  function startMinigame(statName) {
    if (playerStats.trainsLeft <= 0) return;
    if (playerStats.trainsLeft > 0) {
      minigame.active = true;
      minigame.cursor = 10;
      minigame.dir = 1;
      minigame.speed = 3.6;
      minigame.hits = 0;
      minigame.attempts = 0;
      minigame.statTarget = statName;minigame.frames=0;minigame.jumped=false;minigame.sequence=['KeyZ','KeyX','KeyZ','KeyZ','KeyX','KeyZ'];
      sfxSelect();
    }
  }

  // ========================================================
  // 6. CONTROLES (TECLADO + BOTONES EN PANTALLA + CLIC EN CANVAS)
  // ========================================================
  const keys = {};

  function handleActionPress(code) {
    initAudio();

    if (gameState === STATE.TITLE) {
      if(savedRun && code!=='KeyN'){
        Object.assign(playerStats,savedRun.stats);currentFightIndex=savedRun.index;week=savedRun.week;
        gameState=playerStats.trainsLeft===3?STATE.BRIEF:STATE.GYM;startBGM('gym');return;
      }
      clearProgress();
      gameState = STATE.INTRO_STORY;
      storyStep = 0;
      startBGM('madero');
      sfxSelect();
      return;
    }

    if (gameState === STATE.INTRO_STORY) {
      storyStep++;
      sfxSelect();
      if (storyStep >= 2) {
        currentFightIndex = 0;
        gameState = STATE.VS_SCREEN;
        vsTimer = 210;
        startBGM('vs');
      }
      return;
    }

    if (gameState === STATE.VS_SCREEN) {
      if (vsTimer < 170) {
        vsTimer = 0;
      }
      return;
    }

    if (gameState === STATE.POST_ROBO) {
      storyStep++;
      if (storyStep >= 2) { gameState = STATE.ARRIVAL; sceneFrame = 0; }
      sfxSelect(); return;
    }
    if (gameState === STATE.ARRIVAL) {
      if (sceneFrame >= 240) { gameState = STATE.COACH; startBGM('gym'); }
      return;
    }
    if(gameState===STATE.BRIEF){gameState=STATE.GYM;sfxSelect();return;}
    if(gameState === STATE.TRAIN_TRAVEL){if(sceneFrame>=45)finishTravel();return;}
    if(gameState === STATE.WEEK_RESULT) {
      if(sceneFrame < 120) return;
      if(weekResult.won) currentFightIndex++;
      week++;playerStats.trainsLeft=3;playerStats.skillPoints=0;
      playerStats.fatigue=Math.max(0,playerStats.fatigue-15);playerStats.goodFood=false;recoveryMessage='';
      gameState=STATE.BRIEF;saveProgress();startBGM('gym');sfxSelect();return;
    }
    if (gameState === STATE.COACH) {
      playerStats.skillPoints = 0; playerStats.trainsLeft = 3;
      currentFightIndex = 1; week = 1; gameState = STATE.BRIEF;
      sfxSelect(); return;
    }
    if (gameState === STATE.GYM && minigame.active) {
      if(!['KeyZ','KeyX','Space'].includes(code))return;
      if(minigame.statTarget==='tecnica'){
        const expected=minigame.sequence[minigame.attempts];
        if(code===expected || code==='Space'&&expected==='KeyZ'){minigame.hits++;sfxParry();}else sfxWeakHit();
        minigame.attempts++;if(minigame.attempts>=6)finishTraining();
      }else if(minigame.statTarget==='aguante'){
        minigame.hits++;sfxHit();if(minigame.hits>=12)finishTraining();
      }else if(minigame.statTarget==='velocidad'){
        if(!minigame.jumped){minigame.jumped=true;if(minigame.cursor>=38&&minigame.cursor<=62){minigame.hits++;sfxParry();}else sfxWeakHit();}
      }else{
        minigame.attempts++;
        if(minigame.cursor>=38&&minigame.cursor<=62){minigame.hits++;sfxParry();}else sfxWeakHit();
        minigame.speed+=.7;if(minigame.attempts>=3)finishTraining();
      }
      return;
    }

    if (gameState === STATE.VICTORY_FINAL) {
      // Reiniciar juego
      playerStats.fuerza = 1;
      playerStats.velocidad = 1;
      playerStats.aguante = 1;
      playerStats.tecnica = 1;
      playerStats.fatigue=0;playerStats.money=60;playerStats.goodFood=false;playerStats.trainsLeft=3;week=1;recoveryMessage='';
      gameState = STATE.TITLE;
      sfxSelect();
      return;
    }

    // Acciones en combate
    if (gameState === STATE.FIGHT && player && (player.state === 'idle' || player.state === 'walk')) {
      if (code === 'KeyZ') {
        player.state = 'punch';
        player.stateTimer = Math.max(20, 26 - Math.min(6,playerStats.velocidad));
        executePlayerAttack('punch');
      } else if (code === 'KeyX') {
        player.state = 'kick';
        player.stateTimer = Math.max(28, 34 - Math.min(6,playerStats.velocidad));
        executePlayerAttack('kick');
      } else if (code === 'KeyV' && player.energy >= 100 && !FIGHTS[currentFightIndex].isPrologue) {
        player.energy = 0;
        player.state = 'special';
        player.stateTimer = 38;
        specialFx=38;specialOrigin=player.x;specialDirection=player.dir;
        executePlayerAttack('special');
      }
    }
  }

  window.addEventListener('keydown', (e) => {
    keys[e.code] = true;
    if (['KeyZ', 'KeyX', 'KeyV', 'Space', 'Enter', 'KeyN'].includes(e.code)) {
      handleActionPress(e.code);
    }
  });

  window.addEventListener('keyup', (e) => {
    keys[e.code] = false;
  });

  // Botones táctiles inferiores
  document.querySelectorAll('.ctrl-btn').forEach(btn => {
    const k = btn.dataset.key;
    btn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      keys[k] = true;
      handleActionPress(k);
    });
    btn.addEventListener('pointerup', (e) => {
      e.preventDefault();
      keys[k] = false;
    });
    btn.addEventListener('pointerleave', () => { keys[k] = false; });
  });

  // Clics directos en el Canvas (para el Gimnasio y pantallas de historia)
  canvas.addEventListener('pointerdown', (e) => {
    initAudio();
    const rect = canvas.getBoundingClientRect();
    const mx = ((e.clientX - rect.left) / rect.width) * canvas.width;
    const my = ((e.clientY - rect.top) / rect.height) * canvas.height;

    if(gameState===STATE.TITLE&&savedRun&&my>=357){handleActionPress('KeyN');return;}
    if (gameState === STATE.GYM) {
      if (minigame.active) {
        handleActionPress('KeyZ');
        return;
      }
      if(playerStats.trainsLeft===0){
        if(my>=185&&my<=245){
          if(mx>=40&&mx<=300){
            if(fightShop)recover('food');
            else {gameState=STATE.VS_SCREEN;vsTimer=210;fightShop=false;startBGM('vs');}
          }else if(mx>=340&&mx<=600){if(fightShop)recover('massage');else fightShop=true;}
        }
        if(fightShop&&mx>=200&&mx<=440&&my>=320&&my<=365)fightShop=false;
        return;
      }
      // Botones de entrenamiento de estadísticas
      const statsList = ['fuerza', 'velocidad', 'aguante', 'tecnica'];
      statsList.forEach((st, idx) => {
        const bx = 40 + (idx % 2) * 280;
        const by = 130 + Math.floor(idx / 2) * 68;
        if (mx >= bx && mx <= bx + 260 && my >= by && my <= by + 54) {
          startMinigame(st);
        }
      });

      if(my>=270 && my<=306){
        if(mx>=30&&mx<=210)recover('rest');
        else if(mx>=230&&mx<=410)recover('food');
        else if(mx>=430&&mx<=610)recover('massage');
        return;
      }

      // Botón IR A PELEAR
      if (playerStats.trainsLeft === 0 && mx >= 200 && mx <= 440 && my >= 335 && my <= 385) {
        sfxSelect();
        gameState = STATE.VS_SCREEN;
        vsTimer = 210;
        startBGM('vs');
      }
      return;
    }

    handleActionPress('Space');
  });

  // ========================================================
  // 7. LÓGICA DE ATAQUES Y BALANCE DEL PRIMER RIVAL (KEVIN)
  // ========================================================
  function executePlayerAttack(type) {
    const f = FIGHTS[currentFightIndex];
    const dist = Math.abs(player.x - enemy.x);
    const reach = type === 'kick' ? 88 : (type === 'special' ? 115 : 70);

    if (dist <= reach && enemy.state !== 'ko') {
      // BALANCE DEL PRÓLOGO PEDIDO:
      // Podés pegarle 2, 3, 4 o 5 veces seguidas y entran los golpes, pero le sacan muy poquita vida (2 a 4 HP).
      // Después de que le conectás unos golpes intentando defenderte, Kevin se enoja y empieza a contratacar fuerte.
      if (f.isPrologue) {
        const chipDmg = type === 'kick' ? 4 : 3;
        enemy.hp = Math.max(180, enemy.hp - chipDmg);
        enemy.state = 'hit';
        enemy.stateTimer = 10; // Se sacude para que sientas que le pegaste
        enemy.vx = 2.2;
        prologueHitsLanded++;
        sfxWeakHit();
        addFloatingText(enemy.x, enemy.y - 85, `¡POCA FUERZA! -${chipDmg}`, '#ff9966');

        if (prologueHitsLanded === 3) {
          enemy.enraged = true;
          fightBanner = 'KEVIN: "¿ME QUERÉS PEGAR GIL? ¡AHORA VAS A VER!"';
          fightBannerTimer = 110;
        }
        return;
      }

      // Combates normales del Torneo y UFC
      let baseDmg = type === 'punch' ? 8 : (type === 'kick' ? 13 : 32);
      let totalDmg = Math.round(baseDmg + playerStats.fuerza * 1.8 + (type === 'special' ? playerStats.tecnica * 3 : 0));

      // Una secuencia repetida de golpes provoca guardia y contraataque.
      const style=rivalStyles[currentFightIndex];
      enemy.hitsTaken++;
      if(type !== 'special' && ((enemy.state==='block' && type==='punch') || enemy.hitsTaken % (style==='defensive'?3:style==='counter'?4:5) === 0)) {
        totalDmg = Math.max(2, Math.round(totalDmg*.25));
        enemy.hp = Math.max(0,enemy.hp-totalDmg);
        enemy.state='block';enemy.stateTimer=8;enemy.telegraph=style==='counter'?8:14;
        enemy.aiCooldown=12;
        player.energy=Math.min(100,player.energy+18);
        addFloatingText(enemy.x,enemy.y-90,'¡GUARDIA!', '#66dd88');sfxBlock();return;
      }

      // Si el enemigo tenía cartel de alerta (!), metés ANTICIPO crítico
      if (enemy.telegraph > 0) {
        totalDmg = Math.round(totalDmg * 1.45);
        enemy.telegraph = 0;
        addFloatingText(enemy.x, enemy.y - 95, `¡ANTICIPO CRÍTICO! -${totalDmg}`, '#00ffcc');
        sfxParry();
      } else {
        addFloatingText(enemy.x, enemy.y - 85, `-${totalDmg}`, '#ffcc00');
        sfxHit(type !== 'punch');
      }

      enemy.hp = Math.max(0, enemy.hp - totalDmg);
      enemy.state = 'hit';
      enemy.stateTimer = 7;
      enemy.vx = player.dir * (type === 'kick' ? 6 : 3.5);
      if(type !== 'special') player.energy = Math.min(100, player.energy + 22);
      if(player.energy === 100 && type !== 'special'){fightBanner='¡ESPECIAL LISTA! APRETÁ V';fightBannerTimer=60;}
      player.combo++;
    }
  }

  // ========================================================
  // 8. LOOP DE ACTUALIZACIÓN (UPDATE)
  // ========================================================
  function update() {
    if(gameState===STATE.TRAIN_TRAVEL){sceneFrame++;if(sceneFrame>=110)finishTravel();return;}
    if(gameState === STATE.WEEK_RESULT){sceneFrame++;return;}
    if (gameState === STATE.ARRIVAL) { sceneFrame++; if (sceneFrame >= 330) { gameState = STATE.COACH; startBGM('gym'); } return; }
    if (gameState === STATE.VS_SCREEN) {
      vsTimer--;
      if (vsTimer <= 0) {
        setupFight(currentFightIndex);
        gameState = STATE.FIGHT;
        startBGM(FIGHTS[currentFightIndex].stage === 'ufc_octagon' ? 'ufc' : 'madero');
      }
      return;
    }

    if (gameState === STATE.GYM && minigame.active) {
      minigame.frames++;
      if(minigame.statTarget==='aguante'){if(minigame.frames>=300)finishTraining();return;}
      if(minigame.statTarget==='tecnica')return;
      minigame.cursor+=minigame.dir*minigame.speed;
      if(minigame.statTarget==='velocidad'){
        if(minigame.cursor>=100){minigame.cursor=0;minigame.jumped=false;minigame.attempts++;if(minigame.attempts>=5)finishTraining();}
      }else if(minigame.cursor>=100){minigame.cursor=100;minigame.dir=-1;}else if(minigame.cursor<=0){minigame.cursor=0;minigame.dir=1;}
      return;
    }

    if (gameState !== STATE.FIGHT) return;

    const f = FIGHTS[currentFightIndex];

    if(specialFx>0)specialFx--;
    // Reloj de combate
    lastSecondTick++;
    if (lastSecondTick >= 60 && fightTimer > 0) {
      fightTimer--;
      lastSecondTick = 0;
    }

    if (fightBannerTimer > 0) fightBannerTimer--;

    // Textos flotantes
    floatingTexts.forEach(t => {
      t.y -= 0.8;
      t.life--;
    });
    floatingTexts = floatingTexts.filter(t => t.life > 0);

    // Actualizar Jugador
    if (player.stateTimer > 0) {
      player.stateTimer--;
      if (player.stateTimer === 0 && player.state !== 'ko') {
        player.state = 'idle';
      }
    }

    const moveSpeed = (2.6 + playerStats.velocidad * 0.45)*(1-(f.isPrologue?0:playerStats.fatigue/470));
    if (player.state === 'idle' || player.state === 'walk' || player.state === 'block') {
      if (keys['KeyC']) {
        player.state = 'block';
        player.vx = 0;
      } else if (keys['ArrowLeft']) {
        player.vx = -moveSpeed;
        player.state = 'walk';
      } else if (keys['ArrowRight']) {
        player.vx = moveSpeed;
        player.state = 'walk';
      } else {
        player.vx = 0;
        player.state = 'idle';
      }
    }

    player.x += player.vx;
    player.vx *= 0.8;
    player.x = Math.max(45, Math.min(595, player.x));
    player.dir = player.x <= enemy.x ? 1 : -1;

    // Actualizar Rival (IA)
    if (enemy.stateTimer > 0) {
      enemy.stateTimer--;
      if (enemy.stateTimer === 0 && enemy.state !== 'ko') {
        enemy.state = 'idle';
      }
    }

    if (enemy.telegraph > 0) {
      enemy.telegraph--;
      if (enemy.telegraph === 0 && enemy.state !== 'hit' && enemy.state !== 'ko') {
        // Lanza el golpe anunciado
        enemy.state = 'attack';
        enemy.stateTimer = 18;
        const dist = Math.abs(enemy.x - player.x);
        if (dist < 82) {
          // En el prólogo: al principio te deja pegarle un par de veces, y cuando se enoja te saca de a 28-35 HP (te gana en ~3 o 4 golpes, no de una)
          let dmg = f.isPrologue ? (enemy.enraged ? 32 : 22) : f.atk;

          if (player.state === 'block') {
            const blockedDmg = f.isPrologue ? 12 : Math.max(2, Math.round(dmg * 0.22));
            player.hp = Math.max(0, player.hp - blockedDmg);
            player.energy = Math.min(100, player.energy + 15);
            sfxBlock();
            addFloatingText(player.x, player.y - 80, `GUARDIA -${blockedDmg}`, '#66dd88');
          } else {
            player.hp = Math.max(0, player.hp - dmg);
            player.state = 'hit';
            player.stateTimer = 16;
            player.combo = 0;
            if(!f.isPrologue) player.energy=Math.min(100,player.energy+12);
            sfxHit(true);
            addFloatingText(player.x, player.y - 85, `-${dmg}`, '#ff4444');
          }
        }
      }
    }

    // Movimiento IA
    if (enemy.state === 'idle' && enemy.telegraph === 0 && player.hp > 0 && enemy.hp > 0) {
      const dist = enemy.x - player.x;
      enemy.dir = dist >= 0 ? -1 : 1;

      // En el prólogo, los primeros segundos Kevin se confía para que puedas meterle tus primeros 2 o 3 golpes
      if (f.isPrologue && prologueHitsLanded >= 2) {
        enemy.enraged = true;
      }

      if (Math.abs(dist) > 68) {
        const spd = f.isPrologue && !enemy.enraged ? 1.5 : f.speed;
        enemy.x -= Math.sign(dist) * spd;
      } else {
        const style=rivalStyles[currentFightIndex];
        if(style==='defensive' && enemy.aiCooldown>18){enemy.state='block';enemy.stateTimer=10;enemy.aiCooldown-=10;}
        if(style==='counter' && player.state==='idle' && enemy.aiCooldown>12){enemy.aiCooldown-=.3;}else enemy.aiCooldown--;
        const threshold = (f.isPrologue && !enemy.enraged) ? 42 : 18;
        if (enemy.aiCooldown <= 0) {
          enemy.telegraph = 14; // Señal (!) antes de pegar
          enemy.aiCooldown = Math.max(22, 46 - currentFightIndex * 5)+(rivalStyles[currentFightIndex]==='pressure'?-5:rivalStyles[currentFightIndex]==='defensive'?12:0);
        }
      }
    }

    // Emboscada de El Braian en el prólogo si ya le pegaste varias veces y te queda poca vida
    if (f.isPrologue && !braianAmbush.active && !braianAmbush.done && prologueHitsLanded >= 3 && player.hp <= 48) {
      braianAmbush.active = true;
      braianAmbush.x = Math.max(20, player.x - 140);
      fightBanner = '¡CUIDADO! ¡EL BRAIAN APARECE DE ATRÁS!';
      fightBannerTimer = 100;
    }

    if (braianAmbush && braianAmbush.active && !braianAmbush.done) {
      braianAmbush.x += 5.2;
      if (braianAmbush.x >= player.x - 25) {
        braianAmbush.done = true;
        player.hp = 0;
        sfxKO();
        addFloatingText(player.x, player.y - 95, '¡GOLPE TRAICIONERO DE ATRÁS!', '#ff2222');
      }
    }

    // Comprobar Fin del Combate
    if (player.hp <= 0 && player.state !== 'ko') {
      player.state = 'ko';
      sfxKO();
      setTimeout(() => {
        if (f.isPrologue) {
          gameState = STATE.POST_ROBO; storyStep = 0;
        } else {
          // Si perdés en el torneo, volvés al gimnasio con 1 entrenamiento extra de motivación
          recordResult(false,f.name);
        }
      }, 1700);
    } else if (enemy.hp <= 0 && enemy.state !== 'ko') {
      enemy.state = 'ko';
      sfxKO();
      fightBanner = '¡K.O. - GANADOR LAUTARO!';
      fightBannerTimer = 120;
      setTimeout(() => {
        if (f.isPrologue) {
          currentFightIndex = 1; gameState = STATE.POST_ROBO; storyStep = 0;
        } else if (currentFightIndex >= FIGHTS.length - 1) {
          clearProgress();gameState = STATE.VICTORY_FINAL;

  function drawFighterSprite(f, isPlayer, topColor, capColor) {
    ctx.save();
    const moving = f.state === 'walk';
    const phase = Date.now()/120;
    const bob = moving ? Math.sin(phase)*2 : Math.sin(phase/3);
    ctx.translate(Math.round(f.x), Math.round(f.y));
    ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(0,3,35,7,0,0,Math.PI*2);ctx.fill();
    ctx.scale(f.dir || 1,1);
    if(f.state==='ko'){ctx.rotate(-Math.PI/2);ctx.translate(0,-12);}
    ctx.translate(0,bob);
    const skin=f.coach?'#d3a27d':isPlayer?'#d7a078':'#bb865f', light=f.coach?'#e8ba92':isPlayer?'#f2bd91':'#dda778';
    const pants=isPlayer?'#263c69':'#252a3a',glove=f.coach||f.state==='seated'?skin:isPlayer?'#cb313b':'#dba235';
    function poly(points,color){ctx.fillStyle=color;ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.fill();ctx.strokeStyle='#171a24';ctx.lineWidth=2;ctx.stroke();}
    function limb(x,y,ex,ey,width,color){const dx=ex-x,dy=ey-y,l=Math.hypot(dx,dy)||1,nx=-dy/l*width/2,ny=dx/l*width/2;poly([[x+nx,y+ny],[ex+nx,ey+ny],[ex-nx,ey-ny],[x-nx,y-ny]],color);}
    function hand(x,y){poly([[x-7,y-8],[x+6,y-9],[x+10,y-3],[x+8,y+6],[x-6,y+7],[x-9,y]],glove);ctx.fillStyle='#f4b8a2';ctx.fillRect(x-5,y-6,9,2);}
    const seated=f.state==='seated';
    const kick=f.state==='kick',punch=['punch','attack','special'].includes(f.state),block=f.state==='block';
    // Rear leg and shoes.
    const stride=moving?Math.sin(phase)*9:0;
    if(seated){
      limb(-9,-43,-29,-39,15,pants);limb(-29,-39,-28,-4,12,pants);
      limb(8,-43,30,-34,16,pants);limb(30,-34,31,-4,12,pants);
      poly([[-36,-9],[-22,-9],[-18,0],[-38,0]],'#151924');
      poly([[25,-9],[39,-9],[44,0],[23,0]],'#151924');
    } else {
    limb(-9,-43,-20-stride,-22,15,pants);limb(-20-stride,-22,-25-stride,-4,12,pants);
    poly([[-33-stride,-9],[-19-stride,-9],[-13-stride,0],[-35-stride,0]],'#151924');
    if(kick){limb(8,-44,31,-56,16,pants);limb(31,-56,62,-62,12,pants);poly([[56,-69],[71,-68],[76,-59],[58,-55]],'#151924');}
    else{limb(8,-43,20+stride,-23,16,pants);limb(20+stride,-23,18+stride,-5,12,pants);poly([[12+stride,-10],[25+stride,-10],[32+stride,-1],[10+stride,-1]],'#151924');}
    }
    ctx.fillStyle='#536b94';ctx.fillRect(-13,-40,4,14);
    // Rear guarded arm, torso and shirt folds.
    if(seated){limb(-15,-88,-23,-65,14,skin);limb(-23,-65,-27,-42,12,skin);hand(-27,-40);}else{limb(-15,-88,-26,-66,14,skin);limb(-26,-66,-7,-77,12,skin);hand(-6,-79);}
    poly([[-13,-101],[9,-99],[24,-88],[19,-66],[12,-44],[-15,-44],[-22,-67],[-25,-88]],topColor);
    poly([[-13,-97],[-5,-85],[4,-85],[10,-97],[4,-102],[-7,-103]],skin);
    ctx.fillStyle='rgba(255,255,255,.2)';ctx.fillRect(-15,-86,5,26);
    ctx.fillStyle=light;ctx.fillRect(18,-83,6,8);ctx.fillStyle='#88513c';ctx.fillRect(22,-75,3,7);ctx.fillRect(-8,-52,20,3);
    ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(10,-82,5,26);ctx.fillRect(-5,-67,14,3);
    if(f.hasBackpack){poly([[-23,-90],[-33,-85],[-31,-53],[-20,-50]],'#86623a');}
    // Profile with jaw, nose, ear and hair.
    ctx.save();if(seated){ctx.translate(0,-99);ctx.rotate(.42);ctx.translate(0,99);}
    poly([[-9,-126],[7,-127],[15,-118],[13,-111],[19,-107],[13,-104],[11,-96],[0,-93],[-10,-101],[-13,-117]],skin);
    ctx.fillStyle=light;ctx.fillRect(0,-118,10,11);ctx.fillRect(-4,-105,9,5);
    poly([[-13,-119],[-14,-129],[-6,-134],[5,-132],[13,-126],[11,-119],[1,-122],[-5,-115],[-9,-109]],f.coach?'#a9aaa2':isPlayer?'#172a43':'#35251f');
    ctx.fillStyle='#fff';ctx.fillRect(7,-114,5,3);ctx.fillStyle='#171a24';ctx.fillRect(10,-114,2,3);ctx.fillRect(5,-118,8,2);ctx.fillRect(8,-102,5,2);
    ctx.fillStyle='#b57153';ctx.fillRect(-10,-111,4,7);
    if(f.coach){ctx.fillStyle='#dedbd0';ctx.fillRect(5,-104,10,3);ctx.fillRect(-12,-117,4,15);ctx.fillStyle='#80664f';ctx.fillRect(-5,-99,14,2);ctx.fillRect(0,-110,7,1);}
    if(capColor){poly([[-15,-126],[-12,-136],[7,-136],[15,-127]],capColor);ctx.fillStyle=capColor;ctx.fillRect(5,-127,19,4);}
    else if(isPlayer){ctx.fillStyle='#dc3545';ctx.fillRect(-12,-123,25,4);poly([[-12,-122],[-28,-117],[-19,-115]],'#dc3545');}
    ctx.restore();
    // Front arm reflects the same existing combat states.
    if(seated){limb(17,-86,26,-63,14,skin);limb(26,-63,29,-40,12,light);hand(29,-39);}
    else if(block){limb(16,-87,21,-70,14,skin);limb(21,-70,14,-110,12,light);hand(15,-111);}
    else if(punch){limb(17,-86,36,-86,14,skin);limb(36,-86,61,-90,12,light);hand(65,-90);ctx.fillStyle='rgba(255,255,255,.5)';ctx.fillRect(40,-101,16,2);}
    else{limb(17,-86,28,-68,14,skin);limb(28,-68,35,-95,12,light);hand(35,-98);}
    if(f.state==='special'){ctx.strokeStyle='#ffda42';ctx.lineWidth=3;ctx.beginPath();ctx.arc(63,-90,19,0,Math.PI*2);ctx.stroke();}
    if(!isPlayer&&f.telegraph>0){ctx.fillStyle='#ff3939';ctx.font='bold 20px monospace';ctx.fillText('!',0,-146);}
    ctx.restore();
  }

        const pulse = Math.sin(minigame.cursor / 8) * 7;
        ctx.fillStyle = '#d69a75'; ctx.fillRect(310, 263, 18, 17);
        ctx.fillStyle = '#4a525d'; ctx.fillRect(306, 280, 26, 28);
        ctx.fillStyle = '#d69a75';
        if (minigame.statTarget === 'fuerza') {
          ctx.fillRect(293, 277-pulse, 13, 6); ctx.fillRect(332, 277-pulse, 13, 6);
          ctx.fillStyle='#aaa';ctx.fillRect(281,270-pulse,76,4);
          ctx.fillStyle='#444';ctx.fillRect(279,260-pulse,10,23);ctx.fillRect(348,260-pulse,10,23);
        } else if (minigame.statTarget === 'velocidad') {
          ctx.strokeStyle='#ddd';ctx.beginPath();ctx.ellipse(319,287,38,25+ pulse,0,0,Math.PI*2);ctx.stroke();
        } else {
          ctx.fillRect(332,282,22+pulse,5);
          ctx.fillStyle='#b22';ctx.fillRect(370+pulse,261,24,46);
          ctx.fillStyle='#aaa';ctx.fillRect(380+pulse,252,3,9);
        }

        // Barra de precisión
        if(!['tecnica','aguante'].includes(minigame.statTarget)){
        ctx.fillStyle = '#333';
        ctx.fillRect(120, 220, 400, 26);
        ctx.fillStyle = '#2ee653';
        ctx.fillRect(120 + 400 * 0.38, 220, 400 * 0.24, 26); // Zona verde

        // Cursor móvil
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(120 + (minigame.cursor / 100) * 392, 214, 8, 38);
        }
      }

      // Botón para ir a la pelea
      ctx.fillStyle = '#991f1f';
      ctx.fillRect(200, 335, 240, 45);
      ctx.strokeStyle = '#ffcc00';
      ctx.strokeRect(200, 335, 240, 45);
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ffffff';
      ctx.font = '12px "Press Start 2P"';
      ctx.font = '10px monospace';
      ctx.fillText(playerStats.trainsLeft ? 'COMPLETÁ LOS 3 DÍAS' : 'SÁBADO · ¡IR A PELEAR!', 320, 363);
      return;
    }

    // --- 7. FINAL CAMPEÓN MUNDIAL UFC ---
    if (gameState === STATE.VICTORY_FINAL) {
      drawStageBackground('ufc_octagon');
      ctx.fillStyle = 'rgba(0,0,0,0.82)';
      ctx.fillRect(0, 0, 640, 400);

      ctx.drawImage(getPortraitCanvas('lautaro'), 140, 45, 130, 130);
      ctx.strokeStyle = '#ffcc00';
      ctx.lineWidth = 4;
      ctx.strokeRect(140, 45, 130, 130);

      ctx.drawImage(getPortraitCanvas('osvaldo'), 370, 45, 130, 130);
      ctx.strokeRect(370, 45, 130, 130);

      ctx.textAlign = 'center';
      ctx.fillStyle = '#ffcc00';
      ctx.font = '16px "Press Start 2P"';
      ctx.fillText('¡CAMPEÓN MUNDIAL DE LA UFC!', 320, 215);

      ctx.fillStyle = '#ffffff';
      ctx.font = '9px "Press Start 2P"';
      ctx.fillText('Lautaro recuperó su mochila en el torneo de Villa Madero,', 320, 250);
      ctx.fillText('se volvió viral y noqueó a Henderson en Las Vegas', 320, 272);
      ctx.fillText('con Don Osvaldo en su esquina.', 320, 294);

      ctx.fillStyle = '#2ee653';
      ctx.fillText('[TOCÁ O APRETÁ ESPACIO PARA JUGAR DE NUEVO]', 320, 345);
    }
  }

  // ========================================================
  // 11. PANEL DE SUBAGENTES ADVERSARIALES
  // ========================================================
  const modal = document.getElementById('subagent-modal');
  const modalContent = document.getElementById('subagent-content');

  document.getElementById('btn-subagents').addEventListener('click', () => {
    const f = FIGHTS[currentFightIndex];
    modalContent.innerHTML = `
      <div class="agent-card">
        <div class="agent-title">🎨 AGENTE DE ARTE 16-BITS (RETRO CRT)</div>
        <div>Retratos integrados con paleta de los 90 y tramado (dithering) en la pantalla VS y el HUD: Lautaro con la herida en la mejilla, El Kevin con gorra roja hacia atrás, Don Osvaldo con toalla al cuello, El Braian de campera verde y Henderson con protector bucal frente a la bandera.</div>
      </div>
      <div class="agent-card">
        <div class="agent-title">⚖️ AGENTE ADVERSARIAL DE BALANCE</div>
        <div>En el prólogo en Estación Villa Madero ahora podés conectarle varios golpes seguidos a Kevin sacándole 3-4 HP para que se sienta que te defendiste, antes de que te supere en daño y entre El Braian de atrás.</div>
      </div>
      <div class="agent-card">
        <div class="agent-title">🥊 AGENTE ENTRENADOR (LECTURA DE RIVAL ACTUAL: ${f.name})</div>
        <div>Tus stats actuales: Fuerza ${playerStats.fuerza} | Velocidad ${playerStats.velocidad} | Aguante ${playerStats.aguante} | Técnica ${playerStats.tecnica}. Aprovechá el cartel rojo (!) sobre el rival para anticiparlo con golpe crítico.</div>
      </div>
    `;
    modal.style.display = 'flex';
  });

  document.getElementById('btn-close-modal').addEventListener('click', () => {
    modal.style.display = 'none';
  });

  // Iniciar Loop
  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>
</body>
</html>
